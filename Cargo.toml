[package]
name = "starwarden"
version = "0.1.0"
edition = "2021"
description = "A side-scrolling planet-defence shooter built with Bevy"

[dependencies]
bevy = { version = "0.20", default-features = false, features = [
    "2d",
    "ui",
    "tonemapping_luts",
    "zstd_rust",
] }

# Desktop only: Bevy's audio (the web build uses the browser's audio engine instead, see
# src/audio.rs) and PNG encoding for the developer demo mode's screenshots.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.20", default-features = false, features = ["bevy_audio", "wav", "png"] }

# The web build plays sound through the browser, asks the page how large the game is drawn
# (to size the touch controls) and which graphics mode to use, and keeps the best score in
# localStorage.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "GainNode",
    "Storage",
    "Window",
] }
# The clock, for the date the best score was set (see src/save.rs).
js-sys = "0.3"

# Fast-ish debug builds: optimise dependencies fully, our code lightly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Smaller binary for the web: `trunk build --release` uses this via Trunk.toml.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
