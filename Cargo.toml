[package]
name = "starwarden"
version = "0.1.0"
edition = "2021"
description = "A side-scrolling planet-defence shooter built with Bevy"

[dependencies]
bevy = { version = "0.20", default-features = false, features = [
    "2d",
    "ui",
    "bevy_audio",
    "wav",
    "tonemapping_luts",
    "zstd_rust",
] }

# Only the desktop build can save screenshots (developer demo mode), which needs PNG encoding.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.20", default-features = false, features = ["png"] }

# The web build asks the page how large the game is drawn, to size the touch controls.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window"] }

# Fast-ish debug builds: optimise dependencies fully, our code lightly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Smaller binary for the web: `trunk build --release` uses this via Trunk.toml.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
