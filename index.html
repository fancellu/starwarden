<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#05030f" />
    <title>Starwarden</title>

    <link data-trunk rel="rust" data-bin="starwarden" data-cargo-profile="wasm-release" data-wasm-opt="s" />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05030f;
        /* Stop the page from scrolling, zooming or selecting text while playing. */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #stage {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        /* The resolution script below may shrink this box and scale it back up. */
        transform-origin: 0 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        color: #7fe9ff;
        font: 600 15px/1.4 ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
        letter-spacing: 0.3em;
        pointer-events: none;
      }
      #loading b {
        font-size: 34px;
        letter-spacing: 0.2em;
        color: #ff6ad5;
      }
      #loading.done {
        display: none;
      }
    </style>

    <script>
      // Browsers keep audio suspended until the player interacts with the page. This resumes
      // every AudioContext the game creates on the first key press, click or touch.
      (function () {
        const contexts = [];
        const events = ["click", "mousedown", "pointerup", "touchend", "keydown", "keyup"];
        const Native = self.AudioContext || self.webkitAudioContext;
        if (!Native) return;
        self.AudioContext = new Proxy(Native, {
          construct(target, args) {
            const ctx = new target(...args);
            contexts.push(ctx);
            return ctx;
          },
        });
        function resume() {
          let running = 0;
          for (const ctx of contexts) {
            if (ctx.state !== "running") ctx.resume();
            else running++;
          }
          if (running > 0 && running === contexts.length) {
            events.forEach((e) => document.removeEventListener(e, resume));
          }
        }
        events.forEach((e) => document.addEventListener(e, resume));
      })();

      // Render resolution. Phones often have very dense screens and modest graphics chips, and
      // drawing every physical pixel makes the game stutter there. To draw fewer pixels, the
      // stage is laid out smaller than the window and stretched back with a CSS transform; the
      // game sizes its canvas from the stage, so it never needs to know.
      //
      // The limit is the number of pixels along the short side of the screen. It starts at the
      // screen's own resolution and steps down while the frame rate stays low. The result is
      // remembered for the next visit. Override with ?res=720 (any number) or ?res=full.
      (function () {
        const STEPS = [1080, 900, 720, 600, 540];
        const KEY = "starwarden.res";
        const param = new URLSearchParams(location.search).get("res");
        let limit = Infinity;
        let adaptive = true;
        if (param === "full") {
          adaptive = false;
        } else if (Number(param) >= 240) {
          limit = Number(param);
          adaptive = false;
        } else {
          try {
            const saved = Number(localStorage.getItem(KEY));
            if (saved >= 240) limit = saved;
          } catch (e) {}
        }

        function nativeShort() {
          return Math.min(innerWidth, innerHeight) * (devicePixelRatio || 1);
        }
        function apply() {
          const stage = document.getElementById("stage");
          if (!stage) return;
          const k = Math.max(1, nativeShort() / limit);
          stage.style.width = innerWidth / k + "px";
          stage.style.height = innerHeight / k + "px";
          stage.style.transform = k > 1 ? "scale(" + k + ")" : "";
        }
        function setLimit(value, remember) {
          limit = value;
          apply();
          if (remember) {
            try {
              if (value === Infinity) localStorage.removeItem(KEY);
              else localStorage.setItem(KEY, String(value));
            } catch (e) {}
          }
        }
        window.addEventListener("resize", apply);
        document.addEventListener("DOMContentLoaded", apply);

        if (!adaptive) return;
        // Frame-rate watchdog: two slow 2-second windows in a row lower the resolution a step.
        // If a step does not help (the browser is capping the frame rate, or the processor is
        // the limit, not the pixels) it is undone and the watchdog stops.
        const SLOW_FPS = 45;
        window.addEventListener("TrunkApplicationStarted", () => {
          let frames = 0;
          let windowStart = 0;
          let skip = 2; // windows to ignore: start-up, and after each change
          let slow = 0;
          let before = null; // { limit, fps } from before the last step down
          function tick(now) {
            if (!adaptive) return;
            requestAnimationFrame(tick);
            if (document.hidden || !windowStart) {
              windowStart = now;
              frames = 0;
              return;
            }
            frames++;
            const elapsed = now - windowStart;
            if (elapsed < 2000) return;
            const fps = (frames * 1000) / elapsed;
            windowStart = now;
            frames = 0;
            if (elapsed > 2500) return; // the tab was stalled or in the background
            if (skip > 0) {
              skip--;
              return;
            }
            if (before) {
              if (fps < before.fps * 1.1) {
                setLimit(before.limit, true);
                adaptive = false;
                return;
              }
              before = null;
            }
            slow = fps < SLOW_FPS ? slow + 1 : 0;
            if (slow < 2) return;
            const current = Math.min(limit, nativeShort());
            // Take a step big enough to matter: at least a fifth fewer pixels along each side.
            const next = STEPS.find((s) => s <= current * 0.8);
            if (!next) return;
            before = { limit: limit, fps: fps };
            setLimit(next, true);
            slow = 0;
            skip = 1;
          }
          requestAnimationFrame(tick);
        });
      })();

      // Hide the loading text once the game is running and give the canvas keyboard focus.
      window.addEventListener("TrunkApplicationStarted", () => {
        document.getElementById("loading").classList.add("done");
        const canvas = document.getElementById("game");
        canvas.setAttribute("tabindex", "0");
        canvas.focus();
      });
    </script>
  </head>
  <body>
    <div id="stage"><canvas id="game"></canvas></div>
    <div id="loading"><b>STARWARDEN</b>LOADING</div>
  </body>
</html>
